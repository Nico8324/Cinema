name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-ios:
    name: Build & test (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Secrets.swift is gitignored; the placeholder template compiles fine
      # and no test talks to the network.
      - name: Provide placeholder secrets
        run: cp Cinema/Model/Data/Secrets.swift.example Cinema/Model/Data/Secrets.swift

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cinema.xcodeproj \
            -scheme Cinema \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO

  test-macos:
    name: Build & test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Provide placeholder secrets
        run: cp Cinema/Model/Data/Secrets.swift.example Cinema/Model/Data/Secrets.swift

      # The converter suite is macOS-only, so without this job its thousand-plus lines never
      # ran in CI at all. Runners have no ffmpeg; the clip-building tests skip themselves via
      # `.enabled(if: ConverterTools.ffmpeg != nil)` rather than failing.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cinema.xcodeproj \
            -scheme Cinema \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  localization:
    name: Strings reach the catalog
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Provide placeholder secrets
        run: cp Cinema/Model/Data/Secrets.swift.example Cinema/Model/Data/Secrets.swift

      # A string missing from the catalog is not a build error — it renders in English in
      # every language, forever, and nothing says so. `xcodebuild` extracts strings but only
      # Xcode.app merges them into the catalog, so anything inside `#if os(macOS)` never
      # arrived: 57 strings, the entire converter interface, invisible to translation from the
      # day they were written. Built for macOS because that is the superset — checking on any
      # other destination reproduces the bug instead of catching it.
      - name: Check every string reaches the catalog
        run: python3 Tools/check-localization.py

  build-tvos:
    name: Build (tvOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Provide placeholder secrets
        run: cp Cinema/Model/Data/Secrets.swift.example Cinema/Model/Data/Secrets.swift

      # Hosted runners don't preinstall the tvOS platform.
      - name: Download tvOS platform
        run: sudo xcodebuild -downloadPlatform tvOS

      # tvOS is a kept platform by decision (2026-08-21): every declared platform builds in CI,
      # or the declaration shrinks — a platform that is declared, unbuilt and unmentioned is the
      # gap this job closes.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cinema.xcodeproj \
            -scheme Cinema \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  build-visionos:
    name: Build (visionOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Provide placeholder secrets
        run: cp Cinema/Model/Data/Secrets.swift.example Cinema/Model/Data/Secrets.swift

      # Hosted runners don't preinstall the visionOS platform.
      - name: Download visionOS platform
        run: sudo xcodebuild -downloadPlatform visionOS

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cinema.xcodeproj \
            -scheme Cinema \
            -destination 'generic/platform=visionOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
